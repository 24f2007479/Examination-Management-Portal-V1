{% extends 'base.html' %}{% block content %}<h3>Examiners</h3>
<table class="table table-striped bg-white"><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Contact</th><th>Status</th><th></th></tr>
{% for u in rows %}<tr><td>E{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.department}}</td><td>{{u.contact}}</td><td>{{u.status}}</td><td class="text-nowrap">
{% if u.status!='Approved' %}<form class="d-inline" method="post" action="{{url_for('admin.admin_examiner_action',uid=u.id,action='approve')}}"><button class="btn btn-sm btn-success">Approve</button></form>{% endif %}
{% if u.status!='Deactivated' %}<form class="d-inline" method="post" action="{{url_for('admin.admin_examiner_action',uid=u.id,action='deactivate')}}"><button class="btn btn-sm btn-outline-danger">Deactivate</button></form>{% endif %}</td></tr>{% endfor %}</table>
{% endblock %}
