{% extends 'base.html' %}{% block content %}<h3>All Examination Slots</h3>
<table class="table table-striped bg-white"><tr><th>ID</th><th>Exam</th><th>Date</th><th>Time</th><th>Examiner (change)</th><th>Seats</th><th>Status</th></tr>
{% for s in slots %}<tr><td>{{s.id}}</td><td>{{s.code}} {{s.ename}}</td><td>{{s.date}}</td><td>{{s.start_time}}-{{s.end_time}}</td>
<td><form method="post" action="{{url_for('admin.admin_slot_examiner',sid=s.id)}}" class="d-flex gap-1"><select name="examiner_id" class="form-select form-select-sm">
{% for u in examiners %}<option value="{{u.id}}" {{'selected' if u.id==s.examiner_id}}>{{u.name}}</option>{% endfor %}</select><button class="btn btn-sm btn-outline-primary">Set</button></form></td>
<td>{{s.available}}/{{s.capacity}}</td><td>{{s.status}}</td></tr>{% endfor %}</table>
{% endblock %}
